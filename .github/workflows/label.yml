name: Címke

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: write
  actions: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const blocking = ["danger", "manual"];

            function labelName(label) {
              return typeof label === "string" ? label : label.name;
            }

            function issueNumberFrom(text) {
              const match = String(text || "").match(/Issue:\s*#(\d+)/);
              return match ? Number(match[1]) : null;
            }

            async function describe(issueNumber) {
              if (!issueNumber) {
                return { blocked: false, summary: "A pull request nem hivatkozik jegyre." };
              }

              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              const hit = issue.labels.map(labelName).filter((name) => blocking.includes(name));

              if (hit.length > 0) {
                return {
                  blocked: true,
                  summary: "A #" + issueNumber + " jegyen rajta van: " + hit.join(", ") + ".",
                };
              }

              return {
                blocked: false,
                summary: "A #" + issueNumber + " jegyen nincs danger vagy manual címke.",
              };
            }

            async function rerun(pr) {
              const deadline = Date.now() + 10 * 60 * 1000;
              while (Date.now() < deadline) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: "label.yml",
                  head_sha: pr.head.sha,
                  event: "pull_request",
                  per_page: 5,
                });
                const run = (data.workflow_runs || []).find((item) => item.head_sha === pr.head.sha);
                if (!run) {
                  core.info("#" + pr.number + ": még nincs címke-ellenőrzés.");
                  return;
                }
                if (run.status === "completed") {
                  try {
                    await github.rest.actions.reRunWorkflow({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: run.id,
                    });
                    core.info("#" + pr.number + ": a címke-ellenőrzés újra fut.");
                    return;
                  } catch (error) {
                    core.info("#" + pr.number + ": az újrafuttatás még nem indult: " + error.message);
                  }
                } else {
                  core.info("#" + pr.number + ": a címke-ellenőrzés még fut, várok.");
                }
                await new Promise((resolve) => setTimeout(resolve, 10000));
              }
              core.setFailed("#" + pr.number + ": a címke-ellenőrzés nem futott újra időben.");
            }

            if (context.eventName === "issues") {
              const changed = context.payload.label && context.payload.label.name;
              if (!blocking.includes(changed)) {
                core.info("Ez a címke nem állítja meg a beolvadást: " + changed);
                return;
              }

              const issueNumber = context.payload.issue.number;
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100,
              });
              const needle = new RegExp("Issue:\\s*#" + issueNumber + "\\b");
              const linked = pulls.filter((pr) => needle.test(pr.body || ""));

              if (linked.length === 0) {
                core.info("Nincs nyitott pull request a #" + issueNumber + " jegyhez.");
                return;
              }

              for (const pr of linked) {
                await rerun(pr);
              }
              return;
            }

            const result = await describe(issueNumberFrom(context.payload.pull_request.body));
            core.info(result.summary);
            if (result.blocked) {
              core.setFailed(result.summary);
            }
