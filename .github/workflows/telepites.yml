name: Telepítés

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  telepites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          project_id: devworkflowtest
          workload_identity_provider: projects/471528593801/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@devworkflowtest.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - run: >
          gcloud run deploy wrokflowtest
          --project=devworkflowtest
          --region=europe-west1
          --source=.
          --port=8080
          --allow-unauthenticated
          --memory=2Gi
          --cpu=1
          --max-instances=1
          --service-account=wrokflowtest-run@devworkflowtest.iam.gserviceaccount.com
          --set-secrets=JWT_KEY=JWT_KEY:latest
          --set-env-vars=COOKIE_SECURE=true
          --quiet
