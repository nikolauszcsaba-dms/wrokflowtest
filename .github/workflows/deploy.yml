name: Telepítés

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      jegy:
        description: Jegy száma, ha ezt a futást egy jegyhez kell kötni
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          project_id: devworkflowtest
          workload_identity_provider: projects/471528593801/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@devworkflowtest.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - run: >
          gcloud run deploy wrokflowtest
          --project=devworkflowtest
          --region=europe-west1
          --source=.
          --port=8080
          --allow-unauthenticated
          --memory=2Gi
          --cpu=1
          --max-instances=1
          --service-account=wrokflowtest-run@devworkflowtest.iam.gserviceaccount.com
          --set-secrets=JWT_KEY=JWT_KEY:latest
          --set-env-vars=COOKIE_SECURE=true
          --quiet

      - id: cim
        run: |
          url="$(gcloud run services describe wrokflowtest --project=devworkflowtest --region=europe-west1 --format='value(status.url)')"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "${url}/api/health")"
          if [ "$code" != "200" ] || ! grep -q '"status":"ok"' /tmp/health.json; then
            echo "A smoke teszt nem sikerült: ${code}"
            cat /tmp/health.json
            exit 1
          fi

      - uses: actions/github-script@v8
        env:
          SERVICE_URL: ${{ steps.cim.outputs.url }}
        with:
          script: |
            const url = process.env.SERVICE_URL;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const shas = new Set([context.sha]);
            try {
              const { data: previous } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "deploy.yml",
                branch: "main",
                status: "success",
                per_page: 1,
              });
              const base = previous.workflow_runs[0]?.head_sha;
              if (base && base !== context.sha) {
                const { data: diff } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: base + "..." + context.sha,
                });
                for (const commit of diff.commits) shas.add(commit.sha);
              }
            } catch (error) {
              core.info("A korábbi telepítés jegyeit nem tudtam összegyűjteni: " + error.message);
            }
            const numbers = new Set();
            for (const sha of shas) {
              const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              });
              for (const pr of pulls.data) {
                const match = String(pr.body || "").match(/Jegy:\s*#(\d+)/);
                if (match) numbers.add(Number(match[1]));
              }
            }
            const typed = String(context.payload.inputs?.jegy || "").trim();
            if (/^\d+$/.test(typed)) numbers.add(Number(typed));
            if (numbers.size === 0) {
              core.info("A commit nem hivatkozik jegyre.");
              return;
            }
            for (const number of numbers) {
              const issue = await github.rest.issues.get({ owner, repo, issue_number: number });
              if (issue.data.pull_request || issue.data.state === "closed") continue;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: "Elkészült.\n" + url,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: number,
                state: "closed",
                state_reason: "completed",
              });
            }
